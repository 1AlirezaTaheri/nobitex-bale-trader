[project]
name = "nobitex-bale-trader"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1", "pandas==2.3.3", "numpy==2.2.6",
    "pydantic==2.11.10", "pydantic-settings==2.10.1", "PyYAML==6.0.3",
    "matplotlib==3.10.7", "cryptography==46.0.7",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.13.3"]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "exchange*", "data*", "indicators*", "strategy*", "risk*", "execution*", "notify*", "backtest*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
